name: ci

permissions:
  contents: read

on:
  push:
    branches: [primary]
  pull_request:
    branches: [primary]

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      # The reference is generated by the Ende release it documents.
      - name: Read the pinned Ende version
        id: pin
        run: echo "ende=v$(jq -r .ende _reference/sources.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Ende
        uses: ./.github/actions/setup-ende
        with:
          version: ${{ steps.pin.outputs.ende }}

      # ende.json links ../satz and ../std/markdown, sibling checkouts CI
      # doesn't have, until satz releases the options the build uses. These
      # checks don't need satz, so they run without the links.
      - name: Drop the local links
        run: >-
          ende eval --no-config 'const config = JSON.parse(Ende.readTextFileSync("ende.json"));
          delete config.links;
          Ende.writeTextFileSync("ende.json", JSON.stringify(config, null, 2) + "\n");'

      - name: Reference matches the pinned releases
        run: ende task check:reference

      - name: Format
        run: ende fmt --check

      - name: Lint
        run: ende lint

  # Off until satz releases the `ignore`, `copy` and `redirects` options and
  # ende.json depends on that release instead of linking ../satz. Then delete
  # the `if` (and the "Drop the local links" step above).
  build:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Read the pinned Ende version
        id: pin
        run: echo "ende=v$(jq -r .ende _reference/sources.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Ende
        uses: ./.github/actions/setup-ende
        with:
          version: ${{ steps.pin.outputs.ende }}

      - name: Build
        run: ende task build

      - name: Check links
        run: ende task check:links

      - name: Type-check
        run: ende task check

      - name: Test
        run: ende task test

      - name: Test examples
        run: ende task test:examples
