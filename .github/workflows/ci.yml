name: ci

permissions:
  contents: read

on:
  push:
    branches: [primary]
  pull_request:
    branches: [primary]

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      # The reference is generated by the Ende release it documents.
      - name: Read the pinned Ende version
        id: pin
        run: echo "ende=v$(jq -r .ende _reference/sources.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Ende
        uses: ./.github/actions/setup-ende
        with:
          version: ${{ steps.pin.outputs.ende }}

      - name: Reference matches the pinned releases
        run: ende task check:reference

      - name: Format
        run: ende fmt --check

      - name: Lint
        run: ende lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Read the pinned Ende version
        id: pin
        run: echo "ende=v$(jq -r .ende _reference/sources.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Ende
        uses: ./.github/actions/setup-ende
        with:
          version: ${{ steps.pin.outputs.ende }}

      - name: Build
        run: ende task build

      - name: Check links
        run: ende task check:links

      - name: Type-check
        run: ende task check

      - name: Test
        run: ende task test

      - name: Test examples
        run: ende task test:examples

      - name: Keep the site for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/primary'
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: _site/
          include-hidden-files: true
          retention-days: 1

  # Publishes the checked site to the R2 bucket behind docs.ende.sh. Cloudflare
  # rules on the zone serve `index.html` for directory URLs, redirect `/x` and
  # `/x.md` to `/x/` and `/x.md/`, and serve /404.html for missing pages.
  #
  # Repository secrets: DOCS_S3_ENDPOINT (https://<account id>.r2.cloudflarestorage.com),
  # DOCS_S3_BUCKET, DOCS_S3_ACCESS_KEY_ID, DOCS_S3_SECRET_ACCESS_KEY.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/primary'
    needs: [reference, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time, in push order.
    concurrency:
      group: deploy
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DOCS_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DOCS_S3_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.DOCS_S3_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      # aws-cli >= 2.23 adds CRC checksums to every upload by default, which R2
      # rejects. Only send them when the API requires it.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BUCKET: ${{ secrets.DOCS_S3_BUCKET }}

    steps:
      - name: Download the site
        uses: actions/download-artifact@v6
        with:
          name: site
          path: _site

      # Pages are cached for five minutes, so a deploy shows up within that
      # without purging the zone's cache. `--delete` removes pages that are
      # gone. Example scripts are uploaded on their own: aws-cli would label
      # `.ts` files video/mp2t.
      - name: Upload to R2
        run: |
          aws s3 sync _site "s3://$BUCKET" --delete --no-progress \
            --exclude "*.ts" \
            --cache-control "public, max-age=300"
          aws s3 sync _site "s3://$BUCKET" --delete --no-progress \
            --exclude "*" --include "*.ts" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=300"
